# ------------------------------------------------------------
# OpenShift (oc) tools for vLLM ServingRuntime + InferenceService (Serverless-first)
# Typical flow:
#   1) oc_ensure_namespace
#   2) oc_apply_vllm_servingruntime
#   3) oc_apply_isvc_vllm
#   Or just call: oc_deploy_llm_serverless (runs all 3 in order).
# ------------------------------------------------------------

# --- Low-level helper ---------------------------------------------------------
- name: oc_raw
  description: Low-level oc runner for one-off commands (prefer scoped tools first).
  command: "oc"
  command_desc: |
    # Examples:
    #   oc get pods -n <ns>
    #   oc describe deployment -n <ns> <name>
    #   oc api-resources

# --- Ensure namespace (idempotent) --------------------------------------------
- name: oc_ensure_namespace
  description: Create a namespace if it does not exist (idempotent).
  command: "bash"
  command_desc: |
    # env: NAMESPACE
    bash -lc '
      : "${NAMESPACE:?NAMESPACE required}"
      if ! oc get ns "${NAMESPACE}" >/dev/null 2>&1; then
        echo "Creating namespace ${NAMESPACE} ..."
        oc create ns "${NAMESPACE}"
      else
        echo "Namespace ${NAMESPACE} already exists."
      fi
      oc get ns "${NAMESPACE}" -o yaml | sed -n "1,80p"
    '

# --- ServingRuntime (Serverless vLLM) -----------------------------------------
- name: oc_apply_vllm_servingruntime
  description: Create/Update a **Serverless** vLLM ServingRuntime in the target namespace.
  command: "bash"
  command_desc: |
    # env:
    #   NAMESPACE (required)
    #   RUNTIME_NAME    (default: vllm-serverless-runtime)
    #   RUNTIME_IMAGE   (default: quay.io/modh/vllm@sha256:db766445a1e3455e1bf7d16b008f8946fcbe9f277377af7abb81ae358805e7e2)
    #   DISPLAY_NAME    (default: "vLLM NVIDIA GPU ServingRuntime for KServe")
    #   RUNTIME_VERSION (default: v0.9.2.1)
    bash -lc '
      set -euo pipefail
      : "${NAMESPACE:?NAMESPACE required}"
      RUNTIME_NAME="${RUNTIME_NAME:-vllm-serverless-runtime}"
      RUNTIME_IMAGE="${RUNTIME_IMAGE:-quay.io/modh/vllm@sha256:db766445a1e3455e1bf7d16b008f8946fcbe9f277377af7abb81ae358805e7e2}"
      DISPLAY_NAME="${DISPLAY_NAME:-vLLM NVIDIA GPU ServingRuntime for KServe}"
      RUNTIME_VERSION="${RUNTIME_VERSION:-v0.9.2.1}"

      cat <<EOF | oc apply -f -
    apiVersion: serving.kserve.io/v1alpha1
    kind: ServingRuntime
    metadata:
      name: ${RUNTIME_NAME}
      namespace: ${NAMESPACE}
      annotations:
        opendatahub.io/recommended-accelerators: '["nvidia.com/gpu"]'
        opendatahub.io/runtime-version: ${RUNTIME_VERSION}
        openshift.io/display-name: ${DISPLAY_NAME}
      labels:
        opendatahub.io/dashboard: "true"
    spec:
      annotations:
        prometheus.io/path: /metrics
        prometheus.io/port: "8080"
      supportedModelFormats:
        - name: vLLM
          version: ">=0"
          autoSelect: true
      multiModel: false
      containers:
        - name: kserve-container
          image: ${RUNTIME_IMAGE}
          command: ["python","-m","vllm.entrypoints.openai.api_server"]
          args: ["--port=8080","--model=/mnt/models","--served-model-name={{.Name}}"]
          env:
            - name: HF_HOME
              value: /tmp/hf_home
          ports:
            - containerPort: 8080
              protocol: TCP
    EOF

          echo "Applied Serverless ServingRuntime ${RUNTIME_NAME} in ${NAMESPACE}."
          oc get servingruntime "${RUNTIME_NAME}" -n "${NAMESPACE}" -o yaml | sed -n "1,160p"
        '

# --- InferenceService (vLLM, Serverless) --------------------------------------
- name: oc_apply_isvc_vllm
  description: >
    Create/Update a Serverless vLLM InferenceService on OpenShift.
    Only required input is STORAGE_URI (defaults to Granite modelcar if omitted).
  command: "bash"
  command_desc: |
    # env:
    #   NAMESPACE      (default: vllm-ai)
    #   NAME           (default: vllm-serve)
    #   STORAGE_URI    (default: oci://registry.redhat.io/rhelai1/modelcar-granite-3-1-8b-base-quantized-w4a16:1.5)
    #   RUNTIME_NAME   (default: vllm-serverless-runtime)  <-- must equal ServingRuntime.metadata.name
    #   IMAGE_PULL_SECRET (optional)
    #   GPU_REQ=1, CPU_REQ=2, MEM_REQ=15Gi
    #   GPU_LIMIT=1, CPU_LIMIT=3, MEM_LIMIT=16Gi
    #   ISTIO_SIDECAR=true
    bash -lc '
      set -euo pipefail
      NAMESPACE="${NAMESPACE:-vllm-ai}"
      NAME="${NAME:-vllm-serve}"
      STORAGE_URI="${STORAGE_URI:-oci://registry.redhat.io/rhelai1/modelcar-granite-3-1-8b-base-quantized-w4a16:1.5}"
      RUNTIME_NAME="${RUNTIME_NAME:-vllm-serverless-runtime}"
      IMAGE_PULL_SECRET="${IMAGE_PULL_SECRET:-}"
      GPU_REQ="${GPU_REQ:-1}"
      CPU_REQ="${CPU_REQ:-2}"
      MEM_REQ="${MEM_REQ:-15Gi}"
      GPU_LIMIT="${GPU_LIMIT:-1}"
      CPU_LIMIT="${CPU_LIMIT:-3}"
      MEM_LIMIT="${MEM_LIMIT:-16Gi}"
      ISTIO_SIDECAR="${ISTIO_SIDECAR:-true}"

      SECRET_BLOCK=""
      if [ -n "$IMAGE_PULL_SECRET" ]; then
        SECRET_BLOCK=$(cat <<EOF
    imagePullSecrets:
      - name: ${IMAGE_PULL_SECRET}
    EOF
    )
          fi

          cat <<EOF | oc apply -f -
    apiVersion: serving.kserve.io/v1beta1
    kind: InferenceService
    metadata:
      name: ${NAME}
      namespace: ${NAMESPACE}
      annotations:
        serving.kserve.io/deploymentMode: Serverless
        sidecar.istio.io/inject: "${ISTIO_SIDECAR}"
        sidecar.istio.io/rewriteAppHTTPProbers: "true"
    spec:
      predictor:
        ${SECRET_BLOCK}
        model:
          runtime: ${RUNTIME_NAME}
          modelFormat:
            name: vLLM
          storageUri: "${STORAGE_URI}"
          args:
            - "--uvicorn-log-level=info"
            - "--max-model-len=2048"
            - "--trust-remote-code"
            - "--distributed-executor-backend=mp"
            - "--tensor-parallel-size=1"
          resources:
            requests:
              cpu: "${CPU_REQ}"
              memory: "${MEM_REQ}"
              nvidia.com/gpu: "${GPU_REQ}"
            limits:
              cpu: "${CPU_LIMIT}"
              memory: "${MEM_LIMIT}"
              nvidia.com/gpu: "${GPU_LIMIT}"
    EOF

          echo "Waiting for InferenceService/${NAME} to become Ready ..."
          oc wait --for=condition=Ready isvc/${NAME} -n "${NAMESPACE}" --timeout=10m || true
          oc get isvc ${NAME} -n ${NAMESPACE} -o wide || true
        '

# --- Status helper ------------------------------------------------------------
- name: oc_get_isvc_status
  description: Show concise status for an InferenceService (URL, components, conditions).
  command: "bash"
  command_desc: |
    # env: NAMESPACE, NAME
    bash -lc '
      : "${NAMESPACE:?NAMESPACE required}"
      : "${NAME:?NAME required}"
      oc get isvc "${NAME}" -n "${NAMESPACE}" -o json \
        | jq "{name:.metadata.name, ns:.metadata.namespace, url:.status.url, components:.status.components, conditions:.status.conditions}"
    '

# --- One-shot orchestrator (recommended) --------------------------------------
- name: oc_deploy_llm_serverless
  description: Ensure namespace and vLLM Serverless ServingRuntime, then create ISVC and show status/URL.
  command: "bash"
  command_desc: |
    # Required env: NAME, NAMESPACE
    # Optional: STORAGE_URI, IMAGE_PULL_SECRET, RUNTIME_NAME
    bash -lc '
      set -euo pipefail
      : "${NAME:?NAME required}"
      : "${NAMESPACE:?NAMESPACE required}"
      export STORAGE_URI="${STORAGE_URI:-oci://registry.redhat.io/rhelai1/modelcar-granite-3-1-8b-base-quantized-w4a16:1.5}"
      export RUNTIME_NAME="${RUNTIME_NAME:-vllm-serverless-runtime}"

      echo "== [1/3] Ensure namespace =="
      kubectl-ai --tool oc_ensure_namespace

      echo "== [2/3] Ensure ServingRuntime (${RUNTIME_NAME}) =="
      kubectl-ai --tool oc_apply_vllm_servingruntime

      echo "== [3/3] Apply InferenceService (${NAME}) =="
      kubectl-ai --tool oc_apply_isvc_vllm

      echo "== URL / Status =="
      oc get isvc "$NAME" -n "$NAMESPACE" -o json | jq "{url:.status.url, conditions:.status.conditions}" || true
    '